<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#191919" />
    <title>Polymind AI</title>
    <script>
      // Apply the stored theme class to <html> BEFORE paint so the persisted
      // choice (ThemeContext key 'unichat-theme') is correct on the first frame,
      // with no flash and no race against late-running effects. MUI no longer
      // touches this class (MuiProvider passes colorSchemeNode={null}).
      (function () {
        try {
          var t = localStorage.getItem('unichat-theme');
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(t === 'dark' ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
