# Production origin vhost for unichat.example.com (CDN → :80).
# Deploy: copy to /etc/nginx/sites-available/unichat, nginx -t, reload.
# Do NOT add listen 443 ssl here (CDN owns TLS; origin 443 hijacks other hosts).

server {
    listen 80;
    listen [::]:80;
    server_name unichat.example.com;

    root /opt/unichat/frontend;
    index index.html;

    # SPA chunk-load recovery: index.html never cached
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }

    # Cheap health — higher allowance so monitors / swarm don't trip limits
    location /api/v1/health/ {
        limit_conn unichat_conn 40;
        limit_conn unichat_api_total 250;
        limit_req  zone=unichat_req burst=120 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API + SSE — protect pool / workers from single-client and global floods
    location /api/ {
        # Per real client IP (after cdn-set-real-ip.conf)
        limit_conn unichat_conn 20;
        # Global concurrent API connections for this vhost
        limit_conn unichat_api_total 180;
        # Sustained request rate
        limit_req  zone=unichat_req burst=80 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        # SSE / long streams (chat, arena, research)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 512m;
    }
}
