# Unichat capacity shield — http-context zones (include from conf.d/).
# Keys use $binary_remote_addr AFTER real_ip (prod edge → real client).
# Pair with sites-available/unichat limit_conn / limit_req directives.

limit_req_zone  $binary_remote_addr zone=unichat_req:10m  rate=40r/s;
limit_conn_zone $binary_remote_addr zone=unichat_conn:10m;
limit_conn_zone $server_name        zone=unichat_api_total:10m;

limit_req_status  429;
limit_conn_status 429;
