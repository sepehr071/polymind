##
server {
  listen 80;
  server_name _;
  root   /usr/share/nginx/html;
  index  index.html;

  # SPA document framing protection. The full CSP (script/style/connect/...) is
  # baked into index.html as a <meta> tag at build time (frontend/vite.config.js);
  # frame-ancestors can only be set as a header, so it lives here alongside
  # X-Frame-Options. NOTE: the live prod (prod) terminates at a server-managed
  # nginx — replicate these two headers there to protect the SPA from framing.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
  }

  location / {
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}
