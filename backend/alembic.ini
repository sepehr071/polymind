# Alembic configuration for the uni-chat Mongo→Postgres migration.
# The SQLAlchemy URL is read from app.config['SQLALCHEMY_DATABASE_URI']
# inside migrations/env.py — leave `sqlalchemy.url` blank here so the
# Flask app config is the single source of truth.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

# Use OS-native path separators inside generated migration scripts.
# Default is `os` which is fine cross-platform.
path_separator = os

# Logging — minimal, write to stderr. Alembic + SQLAlchemy noise is
# acceptable when running migrations interactively; tune in deploy if needed.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = stderr

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = stderr
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_stderr]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
